<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Minimalist Japanese Kamon (Geometric Cherry Blossom Crest) -->
  <defs>
    <linearGradient id="crestRing" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <!-- Circular Kamon Base Badge -->
  <circle cx="32" cy="32" r="28" fill="#0A0D14" />
  <circle cx="32" cy="32" r="25" stroke="url(#crestRing)" stroke-width="1.5" stroke-opacity="0.85" stroke-dasharray="3.5 1.5" />

  <!-- 5 Geometric Origami Sakura Petals forming the crest -->
  <g transform="translate(32, 28)">
    <!-- Top Central Petal -->
    <path d="M0 -15 L4 -6 L0 0 L-4 -6 Z" fill="#E11D48" opacity="0.95" />
    <!-- Top Right Petal -->
    <path d="M14 -5 L7 -1 L0 0 L6 -8 Z" fill="#F43F5E" opacity="0.9" />
    <!-- Bottom Right Petal -->
    <path d="M9 12 L3 5 L0 0 L10 2 Z" fill="#E11D48" opacity="0.85" />
    <!-- Bottom Left Petal -->
    <path d="M-9 12 L-10 2 L0 0 L-3 5 Z" fill="#F43F5E" opacity="0.9" />
    <!-- Top Left Petal -->
    <path d="M-14 -5 L-6 -8 L0 0 L-7 -1 Z" fill="#E11D48" opacity="0.95" />
    <!-- Center Core Dot -->
    <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Elegant Interlocking Precision 'L' Studio Monogram -->
  <path
    d="M20 22 C20 20.895 20.895 20 22 20 H25.5 C26.605 20 27.5 20.895 27.5 22 V42 H42 C43.105 42 44 42.895 44 44 V46 C44 47.105 43.105 48 42 48 H22 C20.895 48 20 47.105 20 46 Z"
    fill="#FFFFFF"
  />
  <!-- Subtle Vermilion Accent Notch in L base -->
  <circle cx="43.5" cy="43.5" r="2" fill="#E11D48" />
</svg>
